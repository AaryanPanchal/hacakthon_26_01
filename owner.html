<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nauka-Uber — Owner Schedule Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="page">

    <nav class="top-nav">
        <a class="brand" href="index.html">
            <span class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16l1.5 4.5a1 1 0 00.95.7h13.1a1 1 0 00.95-.7L21 16"/><path d="M5 16l1-7h12l1 7"/><path d="M12 9V3M9 5h6"/></svg>
            </span>
            Nauka-Uber
        </a>
        <div class="nav-links">
            <a href="index.html" data-page="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 001 1h10a1 1 0 001-1v-9"/></svg><span class="nav-label">Home</span></a>
            <a href="owner.html" data-page="owner.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span class="nav-label">Owner Console</span></a>
            <a href="booker.html" data-page="booker.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg><span class="nav-label">Book Cargo</span></a>
        </div>
    </nav>

    <div class="panel">
        <div class="stamp"><span>Nauka<br>Uber<br>Network</span></div>
        <button type="button" class="back-link" onclick="window.location.href='index.html'">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 15l-5-5 5-5"/></svg>
            Back to welcome gateway
        </button>
        <h2 class="panel-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
            Daily Ops Log — Regular Status Updates
        </h2>

        <div id="handoffBanner" class="info-banner" style="display:none;">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v.01a1 1 0 002 0V7zm-1 3a1 1 0 011 1v4a1 1 0 11-2 0v-4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
            <span id="handoffText"></span>
        </div>

        <form id="statusForm">

            <!-- Vessel verification -->
            <div class="form-group">
                <label for="statusImo">Verify Ship IMO Number <span class="hint">(7 digits)</span></label>
                <input type="text" id="statusImo" pattern="[0-9]{7}" required placeholder="e.g., 9619907">
            </div>

            <!-- 90-day advance booking window -->
            <div class="form-group">
                <label>Mark Unavailable / Busy Dates <span class="hint">(up to 3 months ahead)</span></label>
                <div class="row">
                    <div class="form-group">
                        <label style="font-size:11px; margin-bottom:4px;">Unavailable From</label>
                        <input type="date" id="busyFrom" required>
                    </div>
                    <div class="form-group">
                        <label style="font-size:11px; margin-bottom:4px;">Unavailable Until</label>
                        <input type="date" id="busyTo" required>
                    </div>
                </div>
            </div>

            <!-- Next free port -->
            <div class="form-group">
                <label for="nextFreePort">Next Available Free Destination Port</label>
                <select id="nextFreePort" required>
                    <option value="" disabled selected>Select next port location</option>
                </select>
            </div>

            <button type="submit" class="btn-amber" id="statusBtn">Update Daily Lane Status</button>
            <div id="opsStatus" class="status-msg"></div>
        </form>
    </div>

    <footer class="site-foot">Nauka-Uber &middot; matching coastal freight, one lane at a time</footer>
</div>

<script src="assets/common.js"></script>
<script>
    // Advance-booking calendar constraint: an owner can only mark a busy
    // window somewhere between today and 3 months from today.
    window.addEventListener('DOMContentLoaded', () => {
        NaukaUber.populatePortSelect(document.getElementById('nextFreePort'));

        const busyFromInput = document.getElementById('busyFrom');
        const busyToInput = document.getElementById('busyTo');

        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];

        const maxDate = new Date();
        maxDate.setMonth(today.getMonth() + 3);
        const maxDateStr = maxDate.toISOString().split('T')[0];

        busyFromInput.min = todayStr;
        busyFromInput.max = maxDateStr;
        busyToInput.min = todayStr;
        busyToInput.max = maxDateStr;

        console.log(`Advance-booking window engaged. Latest selectable date: ${maxDateStr}`);

        // If the owner just registered a vessel on index.html, offer to
        // pre-fill its IMO number here so they don't have to retype it.
        const lastVessel = NaukaUber.getLastVessel();
        if (lastVessel && lastVessel.imoNumber) {
            document.getElementById('statusImo').value = lastVessel.imoNumber;
            const banner = document.getElementById('handoffBanner');
            const text = document.getElementById('handoffText');
            text.textContent = `Continuing with ${lastVessel.vesselName || 'your vessel'} (IMO ${lastVessel.imoNumber}) — change it above if this isn't right.`;
            banner.style.display = 'flex';
        }
    });

    document.getElementById('statusForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const btn = document.getElementById('statusBtn');
        const box = document.getElementById('opsStatus');
        btn.innerText = "Broadcasting Route Schedule...";
        btn.disabled = true;
        NaukaUber.hideStatus(box);

        const payload = {
            imo: document.getElementById('statusImo').value,
            busyWindow: {
                from: document.getElementById('busyFrom').value,
                to: document.getElementById('busyTo').value
            },
            nextFreePort: document.getElementById('nextFreePort').value
        };

        console.log("Transmitting operational payload to n8n instance:", payload);

        fetch(NaukaUber.CONFIG.dailyStatusWebhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(res => { if (res.ok) return res.json(); throw new Error(); })
        .then(() => {
            NaukaUber.showStatus(box, 'success', 'Daily availability schedule logged into n8n Cloud!');
            document.getElementById('statusForm').reset();
            document.getElementById('handoffBanner').style.display = 'none';
        })
        .catch(() => {
            NaukaUber.showStatus(box, 'error', "Network transmission error. Make sure your n8n 'daily-status' webhook is active.");
        })
        .finally(() => {
            btn.innerText = "Update Daily Lane Status";
            btn.disabled = false;
        });
    });
</script>
</body>
</html>
