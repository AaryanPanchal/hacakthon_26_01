<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nauka-Uber — Request Shipping Lane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="page">

    <nav class="top-nav">
        <a class="brand" href="index.html">
            <span class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16l1.5 4.5a1 1 0 00.95.7h13.1a1 1 0 00.95-.7L21 16"/><path d="M5 16l1-7h12l1 7"/><path d="M12 9V3M9 5h6"/></svg>
            </span>
            Nauka-Uber
        </a>
        <div class="nav-links">
            <a href="index.html" data-page="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 001 1h10a1 1 0 001-1v-9"/></svg><span class="nav-label">Home</span></a>
            <a href="owner.html" data-page="owner.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span class="nav-label">Owner Console</span></a>
            <a href="booker.html" data-page="booker.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg><span class="nav-label">Book Cargo</span></a>
        </div>
    </nav>

    <div class="panel">
        <div class="stamp"><span>Nauka<br>Uber<br>Network</span></div>
        <h2 class="panel-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
            Request Cargo Freight
        </h2>
        <form id="bookingForm">
            <div class="row">
                <div class="form-group">
                    <label for="originPort">Source Pickup Port</label>
                    <select id="originPort" required>
                        <option value="" disabled selected>Select origin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="destPort">Destination Port</label>
                    <select id="destPort" required>
                        <option value="" disabled selected>Select destination</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="pickupDate">Desired Pickup Date</label>
                    <input type="date" id="pickupDate" required>
                </div>
                <div class="form-group">
                    <label for="deliveryDate">Target Reach Date</label>
                    <input type="date" id="deliveryDate" required>
                </div>
            </div>

            <div class="form-group">
                <label>Cargo Manifest</label>
                <p class="field-note">Enter a quantity for each cargo type if this is a mixed load.</p>

                <!-- Item 1: Container Cargo Option -->
                <div class="cargo-item row">
                    <div class="form-group" style="flex: 2;">
                        <label style="font-size:12px;">Cargo Type 1</label>
                        <select class="cargo-type">
                            <option value="Container" selected>Container Cargo</option>
                            <option value="Machinery">Small Machinery Fleet</option>
                            <option value="Bulk">Bulk Cargo (Coal/Ore)</option>
                            <option value="Vehicles">Vehicles (Ro-Ro)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label style="font-size:12px;">Quantity 1</label>
                        <input type="number" class="cargo-qty" placeholder="Weight (metric tons)" required>
                    </div>
                </div>

                <!-- Item 2: Optional mixed-load cargo -->
                <div class="cargo-item row">
                    <div class="form-group" style="flex: 2;">
                        <label style="font-size:12px;">Cargo Type 2 <span class="hint">(optional mixed load)</span></label>
                        <select class="cargo-type">
                            <option value="">None (no second cargo type)</option>
                            <option value="Machinery" selected>Small Machinery Fleet</option>
                            <option value="Container">Container Cargo</option>
                            <option value="Bulk">Bulk Cargo (Coal/Ore)</option>
                            <option value="Vehicles">Vehicles (Ro-Ro)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label style="font-size:12px;">Quantity 2</label>
                        <input type="number" class="cargo-qty" placeholder="Weight (metric tons)">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-green" id="requestBtn">Broadcast Request to Fleet</button>
            <div id="statusBox" class="status-msg"></div>
        </form>
    </div>

    <footer class="site-foot">Nauka-Uber &middot; matching coastal freight, one lane at a time</footer>
</div>

<script src="assets/common.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        NaukaUber.populatePortSelect(document.getElementById('originPort'));
        NaukaUber.populatePortSelect(document.getElementById('destPort'));
    });

    document.getElementById('bookingForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const requestBtn = document.getElementById('requestBtn');
        const statusBox = document.getElementById('statusBox');

        requestBtn.innerText = "Calculating Constraints...";
        requestBtn.disabled = true;
        NaukaUber.hideStatus(statusBox);

        const cargoItems = [];
        const types = document.querySelectorAll('.cargo-type');
        const qts = document.querySelectorAll('.cargo-qty');

        types.forEach((element, index) => {
            if (element.value !== "" && qts[index].value !== "") {
                cargoItems.push({
                    type: element.value,
                    qty: parseInt(qts[index].value, 10) || 0
                });
            }
        });

        const bookingPayload = {
            originPort: document.getElementById('originPort').value,
            destPort: document.getElementById('destPort').value,
            pickupDate: document.getElementById('pickupDate').value,
            deliveryDate: document.getElementById('deliveryDate').value,
            manifest: cargoItems
        };

        fetch(NaukaUber.CONFIG.bookingWebhookUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(bookingPayload)
        })
        .then(res => { if (res.ok) return res.json(); throw new Error(); })
        .then(() => {
            NaukaUber.showStatus(statusBox, 'success', 'Freight request broadcasted! n8n is scanning active fleets.');
        })
        .catch(() => {
            NaukaUber.showStatus(statusBox, 'error', 'Broadcast fault. Verify your n8n webhook node is active.');
        })
        .finally(() => {
            requestBtn.innerText = "Broadcast Request to Fleet";
            requestBtn.disabled = false;
        });
    });
</script>
</body>
</html>
